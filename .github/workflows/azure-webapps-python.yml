# Nome da pipeline que aparece lá na aba Actions do GitHub
name: Build and deploy Python app to Azure Web App

# Variáveis globais que vamos usar no arquivo
env:
  # Nome do aplicativo configurado no Azure
  AZURE_WEBAPP_NAME: your-app-name
  # Versão do Python usada no projeto
  PYTHON_VERSION: '3.8'

# Gatilhos que disparam a execução da pipeline
on:
  # Dispara automaticamente quando subir código
  push:
    # Só roda se o commit/push for na branch main
    branches: [ "main" ]
  # Permite rodar manualmente pelo botão no site do GitHub
  workflow_dispatch:

# Permissões do token do GitHub para esse workflow
permissions:
  # Permissão apenas de leitura dos arquivos do repositório
  contents: read

# Lista de tarefas (jobs) que vão rodar
jobs:
  # Primeiro job: prepara e compila o projeto
  build:
    # Roda em uma máquina virtual com Ubuntu
    runs-on: ubuntu-latest

    # Passos executados dentro do job de build
    steps:
      # Step adicionado no exercício para imprimir a mensagem
      - name: Mensagem inicial
        # Imprime o texto no terminal da pipeline
        run: echo "Iniciando o deploy do meu projeto!"

      # Clona o código do repositório para dentro da máquina virtual
      - uses: actions/checkout@v4

      # Configura o Python na máquina virtual
      - name: Set up Python version
        # Action oficial que gerencia a instalação do Python
        uses: actions/setup-python@v3.0.0
        with:
          # Pega a versão 3.8 definida nas variáveis lá em cima
          python-version: ${{ env.PYTHON_VERSION }}
          # Faz cache dos pacotes do pip para ser mais rápido nas próximas vezes
          cache: 'pip'

      # Cria e ativa o ambiente virtual do Python
      - name: Create and start virtual environment
        # Executa comandos no terminal Linux
        run: |
          # Cria a pasta do ambiente virtual venv
          python -m venv venv
          # Ativa o ambiente virtual
          source venv/bin/activate

      # Instala as bibliotecas do projeto
      - name: Install dependencies
        # Instala os pacotes listados no requirements.txt
        run: pip install -r requirements.txt

      # Salva os arquivos do projeto para o próximo job poder usar
      - name: Upload artifact for deployment jobs
        # Action que guarda os arquivos como um artefato
        uses: actions/upload-artifact@v4
        with:
          # Nome que dei para o pacote de arquivos
          name: python-app
          # Caminhos incluídos e excluídos
          path: |
            # Pega todo o código da raiz do projeto
            .
            # Não inclui a pasta venv para o upload não ficar pesado
            !venv/

  # Segundo job: publica a aplicação no Azure
  deploy:
    # Permissões específicas deste job
    permissions:
      # Não precisa ler o código, pois vai usar o pacote do job anterior
      contents: none
    # Também roda em uma máquina com Ubuntu
    runs-on: ubuntu-latest
    # Só executa depois que o job de build terminar sem erros
    needs: build
    # Configuração de ambiente do GitHub
    environment:
      # Nome do ambiente de destino
      name: 'Development'
      # Pega a URL pública gerada no deploy para mostrar no GitHub
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}

    # Passos executados dentro do job de deploy
    steps:
      # Baixa os arquivos salvos no job de build
      - name: Download artifact from build job
        # Action que baixa o artefato gerado anteriormente
        uses: actions/download-artifact@v4
        with:
          # Mesmo nome do pacote salvo no upload
          name: python-app
          # Descompacta na raiz da máquina
          path: .

      # Faz o deploy direto no Azure
      - name: 'Deploy to Azure Web App'
        # ID para conseguirmos referenciar a saída (URL) depois
        id: deploy-to-webapp
        # Action oficial da Microsoft para publicar no Azure Web Apps
        uses: azure/webapps-deploy@v2
        with:
          # Pega o nome do aplicativo nas variáveis globais
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          # Pega o perfil de publicação guardado nos Secrets do GitHub
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
